opencollection: 1.0.0
info:
  name: "faspy"
  type: workspace

collections:
  - name: "api"
    path: "collections/api"

specs:

docs: |
  Healthcheck de Faspy: GET /api/health responde service: "faspy".
  Motor 1.3 y endpoints de la tarea 1.4 implementados. Las requests de emisión,
  auditoría y scoring son ejecutables y cubren aprobación, casos sin oferta,
  errores y preflight CORS. Emisión de referencia: anticipo 132300 MXN, tasa
  0.02, pago promedio 32 días; factura_id se deriva del UUID en minúsculas.
  Simular pago conserva un ejemplo legado independiente pendiente de definición.
