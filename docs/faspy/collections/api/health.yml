info:
  name: Health
  type: http
  seq: 1
http:
  method: GET
  url: http://localhost:3000/api/health
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.mode
      operator: eq
      value: simulation
docs: |
  Comprueba que el backend simulado está disponible. Sin credenciales.
  Cambiar el puerto de la URL al usar un worktree en otro puerto.
