info:
  name: Simular pago (contrato)
  type: http
  seq: 5
http:
  method: POST
  url: http://localhost:3000/api/simular-pago
  headers:
    - name: Origin
      value: http://localhost:3001
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"facturaId":"FAC-2026-001"}'
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.factura_id
      operator: eq
      value: FAC-2026-001
    - expression: res.body.margen_neto_pct
      operator: eq
      value: "0.02"
docs: |
  Contrato esperado para simular el pago y la liquidación de una factura fondeada.
  Esta request quedará ejecutable cuando se implemente POST /api/simular-pago;
  actualmente es una referencia de integración y responderá 404.

  Ejemplo legado independiente: no encadenar con la oferta nueva de emisión.
  La política de liquidación y la unidad de margen_neto_pct quedan pendientes
  de coordinación con el ERP; estos importes no son resultados del motor 1.3.

  ### Petición

  ```json
  {
    "facturaId": "FAC-2026-001"
  }
  ```

  ### Respuesta esperada · 200 OK

  ```json
  {
    "factura_id": "FAC-2026-001",
    "principal_retenido": 120000,
    "comision_cobrada": 3000,
    "remanente_dispersado": 27000,
    "margen_neto_pct": 0.02
  }
  ```

  `margen_neto_pct` es numérico y se expresa como fracción; `0.02` representa 2%.
