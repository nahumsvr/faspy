info:
  name: Auditoría de cumplimiento (contrato)
  type: http
  seq: 6
http:
  method: GET
  url: http://localhost:3000/api/compliance/audit
  headers:
    - name: Origin
      value: http://localhost:3001
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body[0].id
      operator: eq
      value: FAC-2026-001
    - expression: res.body[0].decision
      operator: eq
      value: aprobada
docs: |
  Contrato esperado para listar el historial precargado del Centro de Cumplimiento.
  Esta request quedará ejecutable cuando se implemente GET /api/compliance/audit;
  actualmente es una referencia de integración y responderá 404.

  No requiere body ni parámetros. La respuesta es un arreglo de registros
  compatibles con `ComplianceAuditItem` y con los campos adicionales `plazo_dias`,
  `ofac_status` y `motivo_decision` usados por los fixtures. El JSON siguiente es
  un ejemplo representativo; la respuesta completa de la demo devolverá los 18
  registros precargados.

  ### Respuesta esperada · 200 OK

  ```json
  [
    {
      "id": "FAC-2026-001",
      "uuid_cfdi": "0f5b8c4a-6c2d-4e91-9ab3-1d7f2c8e4a10",
      "rfc_cliente": "DIN890214ABC",
      "cliente": "Distribuidora Industrial S.A. de C.V.",
      "monto_mxn": 150000,
      "cfdi_status": "VIGENTE",
      "efos_status": "LIMPIO",
      "score": "ALTO",
      "decision": "aprobada",
      "timestamp": "2026-09-01T14:00:00.000Z",
      "plazo_dias": 60,
      "ofac_status": "LIMPIO",
      "motivo_decision": "CFDI vigente y RFC limpio; pagador A con exposición disponible."
    }
  ]
  ```
