name: Quality
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.2.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: HTTP smoke
        run: |
          pnpm start > /tmp/faspy-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          pnpm test:smoke
